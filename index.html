<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HAMID API TESTER</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0b1120;
    color:#fff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:800px;
    background:#111827;
    padding:30px;
    border-radius:20px;
    box-shadow:0 0 30px rgba(0,0,0,.5);
}

.badge{
    display:inline-block;
    background:#2563eb;
    padding:8px 15px;
    border-radius:50px;
    font-weight:bold;
}

h1{
    text-align:center;
    margin:20px 0 10px;
}

.sub{
    text-align:center;
    color:#9ca3af;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:16px;
    border:0;
    outline:0;
    border-radius:12px;
    background:#1f2937;
    color:#fff;
    font-size:16px;
}

button{
    width:100%;
    padding:16px;
    margin-top:15px;
    border:0;
    border-radius:12px;
    background:#2563eb;
    color:#fff;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
}

#result{
    margin-top:20px;
}

.record{
    background:#1f2937;
    padding:15px;
    border-radius:12px;
    margin-top:10px;
    line-height:1.7;
}

.success{
    border-left:4px solid #22c55e;
}

.error{
    border-left:4px solid #ef4444;
}

.raw{
    background:#020617;
    padding:15px;
    border-radius:12px;
    margin-top:15px;
    overflow:auto;
}

pre{
    white-space:pre-wrap;
    word-break:break-word;
    font-size:13px;
    color:#d1d5db;
}

.footer{
    text-align:center;
    margin-top:25px;
    color:#60a5fa;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="card">

    <span class="badge">
        HAMID API TESTER
    </span>

    <h1>
        API RESPONSE TEST
    </h1>

    <p class="sub">
        JSON API connection test
    </p>

    <input
        id="queryInput"
        type="text"
        placeholder="Enter User ID e.g. 1"
        value="1"
    >

    <button
        id="searchBtn"
        onclick="fetchData()"
    >
        SEARCH
    </button>

    <div id="result"></div>

    <div class="footer">
        POWERED BY HAMID
    </div>

</div>

<script>

/*
========================================
TEST API
========================================

Ye public demo API hai.

Baad mein apni AUTHORIZED API
ka HTTPS endpoint yahan laga sakte ho.
*/

const API_URL =
"http://wasifali.biz.id/public_apis/sim-info-api.php";


async function fetchData(){

    const query =
        document.getElementById("queryInput")
        .value
        .trim();

    const result =
        document.getElementById("result");

    const button =
        document.getElementById("searchBtn");


    if(!query){

        result.innerHTML = `
            <div class="record error">
                Please enter a value.
            </div>
        `;

        return;
    }


    button.disabled = true;
    button.innerText = "LOADING...";


    result.innerHTML = `
        <div class="record">
            Connecting to API...
        </div>
    `;


    try{

        /*
        ====================================
        API REQUEST
        ====================================
        */

        const url =
            API_URL +
            "/" +
            encodeURIComponent(query);


        const response =
            await fetch(url, {

                method:"GET",

                headers:{
                    "Accept":"application/json"
                }

            });


        /*
        ====================================
        HTTP STATUS
        ====================================
        */

        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status +
                " " +
                response.statusText
            );

        }


        /*
        ====================================
        JSON
        ====================================
        */

        const data =
            await response.json();


        console.log(
            "API RESPONSE:",
            data
        );


        /*
        ====================================
        DISPLAY RESPONSE
        ====================================
        */

        let html = `
            <div class="record success">

                <b>API CONNECTED ✓</b>

                <br><br>

                <b>ID:</b>
                ${escapeHTML(data.id)}

                <br>

                <b>Name:</b>
                ${escapeHTML(data.name)}

                <br>

                <b>Username:</b>
                ${escapeHTML(data.username)}

                <br>

                <b>Email:</b>
                ${escapeHTML(data.email)}

                <br>

                <b>Phone:</b>
                ${escapeHTML(data.phone)}

                <br>

                <b>Website:</b>
                ${escapeHTML(data.website)}

            </div>
        `;


        /*
        ====================================
        RAW JSON
        ====================================
        */

        html += `
            <div class="raw">

                <b>RAW JSON RESPONSE</b>

                <br><br>

                <pre>${escapeHTML(
                    JSON.stringify(
                        data,
                        null,
                        2
                    )
                )}</pre>

            </div>
        `;


        result.innerHTML = html;


    }catch(error){

        console.error(
            "API ERROR:",
            error
        );


        result.innerHTML = `
            <div class="record error">

                <b>API ERROR</b>

                <br><br>

                ${escapeHTML(
                    error.message
                )}

                <br><br>

                <small>
                    Check browser console for details.
                </small>

            </div>
        `;

    }finally{

        button.disabled = false;
        button.innerText = "SEARCH";

    }

}


/*
========================================
HTML ESCAPE
========================================
*/

function escapeHTML(value){

    return String(value ?? "")

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/*
========================================
ENTER KEY
========================================
*/

document
.getElementById("queryInput")
.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            fetchData();

        }

    }
);

</script>

</body>
</html>
