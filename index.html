<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HAMID API SEARCH</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#0b1120;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:800px;
    background:#111827;
    padding:30px;
    border-radius:20px;
    box-shadow:0 0 30px rgba(0,0,0,.5);
}

h1{
    text-align:center;
    margin-bottom:10px;
}

.sub{
    text-align:center;
    color:#9ca3af;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:16px;
    border:0;
    outline:0;
    border-radius:12px;
    background:#1f2937;
    color:white;
    font-size:16px;
}

button{
    width:100%;
    padding:16px;
    margin-top:15px;
    border:0;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

#result{
    margin-top:20px;
}

.record{
    background:#1f2937;
    padding:15px;
    border-radius:12px;
    margin-top:10px;
    line-height:1.7;
}

pre{
    white-space:pre-wrap;
    word-break:break-word;
    font-size:13px;
}

.footer{
    text-align:center;
    margin-top:25px;
    color:#60a5fa;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="card">

<h1>HAMID API SEARCH</h1>

<p class="sub">
Authorized API Response Tester
</p>

<input
    id="queryInput"
    type="text"
    placeholder="Enter Search Value"
>

<button onclick="fetchData()">
SEARCH
</button>

<div id="result"></div>

<div class="footer">
POWERED BY HAMID
</div>

</div>


<script>

/* =========================================
   APNI AUTHORIZED API YAHAN LAGAO
   ========================================= */

const API_URL = "http://wasifali.biz.id/public_apis/sim-info-api.php?search=";


async function fetchData(){

    const query =
        document.getElementById("queryInput")
        .value
        .trim();

    const result =
        document.getElementById("result");


    if(!query){

        result.innerHTML = `
            <div class="record">
                Please enter a search value.
            </div>
        `;

        return;
    }


    result.innerHTML = `
        <div class="record">
            Searching...
        </div>
    `;


    try{

        /*
         * API request
         *
         * Example:
         * /api/search?search=123
         */

        const url =
            API_URL +
            "?search=" +
            encodeURIComponent(query);


        const response =
            await fetch(url);


        if(!response.ok){

            throw new Error(
                "HTTP Error: " + response.status
            );
        }


        const data =
            await response.json();


        /* =================================
           RAW JSON RESPONSE
           ================================= */

        console.log("API RESPONSE:", data);


        /* =================================
           RESPONSE STRUCTURE
           
           Expected example:

           {
             "success": true,
             "records": [
               {
                 "name": "Demo",
                 "value": "123",
                 "status": "Active"
               }
             ]
           }
           ================================= */


        if(
            data.success === true &&
            Array.isArray(data.records) &&
            data.records.length > 0
        ){

            let html = "";


            data.records.forEach((item,index)=>{

                html += `

                    <div class="record">

                        <b>
                            Record #${index + 1}
                        </b>

                        <br><br>

                        <b>Name:</b>
                        ${escapeHTML(item.name ?? "N/A")}

                        <br>

                        <b>Value:</b>
                        ${escapeHTML(item.value ?? "N/A")}

                        <br>

                        <b>Status:</b>
                        ${escapeHTML(item.status ?? "N/A")}

                    </div>

                `;
            });


            /* RAW JSON */

            html += `

                <div class="record">

                    <b>RAW API RESPONSE</b>

                    <pre>
${escapeHTML(
    JSON.stringify(data,null,2)
)}
                    </pre>

                </div>

            `;


            result.innerHTML = html;


        }else{

            result.innerHTML = `

                <div class="record">

                    No records found.

                    <br><br>

                    <b>API RESPONSE:</b>

                    <pre>
${escapeHTML(
    JSON.stringify(data,null,2)
)}
                    </pre>

                </div>

            `;

        }


    }catch(error){

        console.error(error);


        result.innerHTML = `

            <div class="record">

                <b>API ERROR</b>

                <br><br>

                ${escapeHTML(error.message)}

                <br><br>

                Check:

                <br>
                • API URL
                <br>
                • HTTPS
                <br>
                • CORS
                <br>
                • JSON response

            </div>

        `;

    }

}


/* =========================================
   HTML SECURITY
   ========================================= */

function escapeHTML(value){

    return String(value)

        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}

</script>

</body>
</html>
