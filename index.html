<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAMID SIM DATABASE</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Space Grotesk',sans-serif;}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:#030712;padding:20px;overflow:hidden;}
body::before{content:"";position:fixed;width:600px;height:600px;background:radial-gradient(circle,#6366f1 0%,transparent 70%);left:-300px;top:-300px;opacity:.3;filter:blur(120px);animation:float1 12s ease-in-out infinite;}
body::after{content:"";position:fixed;width:600px;height:600px;background:radial-gradient(circle,#ec4899 0%,transparent 70%);right:-300px;bottom:-300px;opacity:.3;filter:blur(120px);animation:float2 15s ease-in-out infinite;}
@keyframes float1{0%,100%{transform:translate(0,0) rotate(0deg);}50%{transform:translate(50px,50px) rotate(180deg);}}
@keyframes float2{0%,100%{transform:translate(0,0) rotate(0deg);}50%{transform:translate(-50px,-50px) rotate(-180deg);}}
.card{width:100%;max-width:700px;background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(30px) saturate(180%);border-radius:28px;padding:40px;box-shadow:0 20px 60px rgba(0,0,0,.7);}
.logo{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;background:linear-gradient(135deg,#6366f1,#ec4899);border-radius:16px;font-weight:700;font-size:12px;letter-spacing:3px;color:#fff;text-transform:uppercase;}
h1{font-size:40px;margin:25px 0 10px;font-weight:700;background:linear-gradient(90deg,#818cf8,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.sub{color:#94a3b8;margin-bottom:30px;font-weight:300;font-size:15px;}
.search{display:flex;gap:12px;flex-wrap:wrap;}
input{flex:1;min-width:220px;padding:18px 22px;border:1px solid rgba(255,255,255,.1);outline:none;border-radius:16px;background:rgba(2,6,23,.8);color:white;font-size:16px;transition:.3s;}
input:focus{border-color:#6366f1;box-shadow:0 0 0 4px rgba(99,102,241,.2);}
button{padding:18px 32px;border:none;border-radius:16px;background:linear-gradient(135deg,#6366f1,#ec4899);color:white;font-weight:700;cursor:pointer;transition:.3s;font-size:16px;letter-spacing:.5px;}
button:hover{transform:translateY(-4px);box-shadow:0 15px 40px rgba(236,72,153,.4);}
#result{margin-top:30px;}
.record{background:rgba(2,6,23,.6);padding:22px;border-radius:16px;border:1px solid rgba(255,255,255,.08);border-left:4px solid #6366f1;animation:fade .4s ease;line-height:2;margin-bottom:12px;}
.record b{color:#c4b5fd;}
.label{color:#818cf8;font-weight:600;}
.footer{margin-top:35px;text-align:center;color:#6366f1;font-weight:700;letter-spacing:3px;font-size:12px;}
@keyframes fade{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:650px){.search{flex-direction:column;}button{width:100%;}h1{font-size:28px;}.card{padding:30px 25px;}}
</style>
</head>

<body>

<div class="card">

<div class="logo">HAMID SIM DATABASE</div>

<h1>HAMID SIM DATABASE</h1>

<p class="sub">Premium Search Interface</p>

<div class="search">

<input
id="queryInput"
type="tel"
inputmode="numeric"
placeholder="03XX-XXXXXXX"
maxlength="11">

<button onclick="fetchData()">
🔍 SEARCH
</button>

</div>

<div id="result"></div>

<div class="footer">⚡ POWERED BY HAMID ⚡</div>

</div>

<script>

function fetchData(){

const q=document.getElementById("queryInput").value.trim();
const result=document.getElementById("result");

if(!q){
alert("Enter Mobile Number");
return;
}

// sirf number rakh do
const cleanNumber = q.replace(/[^0-9]/g,'');
if(cleanNumber.length < 10){
alert("Enter Valid Mobile Number");
return;
}

result.innerHTML='<div class="record">⏳ Searching...</div>';

const apiUrl = `https://sim-info-api.wasif-ali.workers.dev/?search=${encodeURIComponent(cleanNumber)}`;

// CORS PROXY LAGAYA
fetch("https://corsproxy.io/?" + encodeURIComponent(apiUrl))
.then(r=>r.json())
.then(data=>{

// API array return karti hai
if(Array.isArray(data) && data.length > 0){

let html="";
data.forEach((r,i)=>{
html+=`
<div class="record">
<b>Record #${i+1}</b><br><br>
<b>Name:</b> ${r.name||"N/A"}<br>
<b>Mobile:</b> ${r.number||"N/A"}<br>
<b>CNIC:</b> ${r.cnic||"N/A"}<br>
<b>Address:</b> ${r.address||"N/A"}<br>
<b>Network:</b> ${r.operator||"N/A"}
</div>
`;
});
result.innerHTML=html;

}else{
result.innerHTML='<div class="record" style="border-left-color:#ef4444;">❌ No Record Found.</div>';
}

}).catch(()=>{

result.innerHTML='<div class="record" style="border-left-color:#ef4444;">❌ API Error. Try Again</div>';

});

}

// Enter se bhi search
document.getElementById("queryInput").addEventListener("keypress", function(e){
if(e.key === "Enter"){ fetchData(); }
});

</script>

</body>
</html>
