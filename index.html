<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HAMID API TESTER</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0b1120;
    color:#fff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:800px;
    background:#111827;
    border-radius:20px;
    padding:30px;
    box-shadow:0 0 30px rgba(0,0,0,.5);
}

.badge{
    display:inline-block;
    padding:8px 15px;
    background:#2563eb;
    border-radius:50px;
    font-weight:bold;
}

h1{
    margin:20px 0;
    text-align:center;
}

.sub{
    text-align:center;
    color:#9ca3af;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:16px;
    border:none;
    outline:none;
    border-radius:12px;
    background:#1f2937;
    color:#fff;
    font-size:16px;
}

button{
    width:100%;
    padding:16px;
    margin-top:15px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:#fff;
    font-size:17px;
    cursor:pointer;
    font-weight:bold;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

#result{
    margin-top:20px;
}

.record{
    background:#1f2937;
    padding:15px;
    border-radius:12px;
    margin-top:10px;
    line-height:1.7;
    overflow:hidden;
}

.raw{
    margin-top:15px;
    background:#020617;
    padding:15px;
    border-radius:12px;
    overflow:auto;
}

pre{
    white-space:pre-wrap;
    word-break:break-word;
    color:#d1d5db;
    font-size:13px;
}

.error{
    border-left:4px solid #ef4444;
}

.success{
    border-left:4px solid #22c55e;
}

.footer{
    text-align:center;
    margin-top:25px;
    color:#60a5fa;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="card">

    <span class="badge">HAMID API TESTER</span>

    <h1>API RESPONSE TESTER</h1>

    <p class="sub">
        Test your authorized JSON API
    </p>

    <input
        id="queryInput"
        type="text"
        placeholder="Enter search value"
        autocomplete="off"
    >

    <button id="searchBtn" onclick="fetchData()">
        SEARCH
    </button>

    <div id="result"></div>

    <div class="footer">
        POWERED BY HAMID
    </div>

</div>

<script>

/*
==================================================
API CONFIG
==================================================

IMPORTANT:

Yahan apni AUTHORIZED API ka HTTPS URL lagao.

Example:

const API_URL =
"https://your-domain.com/api/search.php";

==================================================
*/

const API_URL =
"http://wasifali.biz.id/public_apis/sim-info-api.php";


async function fetchData(){

    const input =
        document.getElementById("queryInput");

    const result =
        document.getElementById("result");

    const button =
        document.getElementById("searchBtn");

    const q = input.value.trim();

    if(!q){

        result.innerHTML = `
            <div class="record error">
                Please enter a search value.
            </div>
        `;

        return;
    }


    /*
    ==============================================
    LOADING
    ==============================================
    */

    button.disabled = true;
    button.innerText = "SEARCHING...";

    result.innerHTML = `
        <div class="record">
            Connecting to API...
        </div>
    `;


    try{

        /*
        ==========================================
        REQUEST
        ==========================================
        */

        const url =
            API_URL +
            "?search=" +
            encodeURIComponent(q);


        const response =
            await fetch(url,{

                method:"GET",

                headers:{
                    "Accept":"application/json"
                }

            });


        /*
        ==========================================
        HTTP STATUS CHECK
        ==========================================
        */

        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status +
                " - " +
                response.statusText
            );

        }


        /*
        ==========================================
        READ RESPONSE
        ==========================================
        */

        const text =
            await response.text();


        if(!text){

            throw new Error(
                "API returned an empty response."
            );

        }


        /*
        ==========================================
        JSON PARSE
        ==========================================
        */

        let data;

        try{

            data = JSON.parse(text);

        }catch(jsonError){

            throw new Error(
                "API did not return valid JSON."
            );

        }


        console.log(
            "API RESPONSE:",
            data
        );


        /*
        ==========================================
        RECORDS
        ==========================================
        */

        if(
            data.success === true &&
            Array.isArray(data.records) &&
            data.records.length > 0
        ){

            let html = "";


            data.records.forEach(
                (record,index)=>{

                    html += `

                    <div class="record success">

                        <b>
                            Record #${index + 1}
                        </b>

                        <br><br>

                        ${createFields(record)}

                    </div>

                    `;

                }
            );


            /*
            ======================================
            RAW JSON
            ======================================
            */

            html += `

                <div class="raw">

                    <b>RAW API RESPONSE</b>

                    <br><br>

                    <pre>${escapeHTML(
                        JSON.stringify(
                            data,
                            null,
                            2
                        )
                    )}</pre>

                </div>

            `;


            result.innerHTML = html;


        }else{

            /*
            ======================================
            NO RECORD
            ======================================
            */

            result.innerHTML = `

                <div class="record">

                    No records found.

                </div>

                <div class="raw">

                    <b>RAW API RESPONSE</b>

                    <br><br>

                    <pre>${escapeHTML(
                        JSON.stringify(
                            data,
                            null,
                            2
                        )
                    )}</pre>

                </div>

            `;

        }


    }catch(error){

        /*
        ==========================================
        ERROR
        ==========================================
        */

        console.error(
            "API ERROR:",
            error
        );


        result.innerHTML = `

            <div class="record error">

                <b>API ERROR</b>

                <br><br>

                ${escapeHTML(
                    error.message
                )}

                <br><br>

                <small>

                    Check:
                    <br>
                    • API URL
                    <br>
                    • HTTPS
                    <br>
                    • CORS
                    <br>
                    • Server availability
                    <br>
                    • JSON response

                </small>

            </div>

        `;


    }finally{

        button.disabled = false;

        button.innerText = "SEARCH";

    }

}


/*
==================================================
DISPLAY JSON OBJECT FIELDS
==================================================
*/

function createFields(record){

    let html = "";

    Object.keys(record).forEach(key=>{

        let value = record[key];


        if(
            typeof value === "object" &&
            value !== null
        ){

            value =
                JSON.stringify(
                    value
                );

        }


        html += `

            <b>
                ${escapeHTML(key)}:
            </b>

            ${escapeHTML(value)}

            <br>

        `;

    });


    return html;

}


/*
==================================================
HTML ESCAPE
==================================================
*/

function escapeHTML(value){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/*
==================================================
ENTER KEY SEARCH
==================================================
*/

document
    .getElementById("queryInput")
    .addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Enter"
            ){

                fetchData();

            }

        }
    );

</script>

</body>
</html>
