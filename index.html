<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API Tester</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:#070b12;
  color:#fff;
  font-family:Arial,sans-serif;
  padding:20px;
}

.app{
  max-width:800px;
  margin:auto;
}

.header{
  text-align:center;
  padding:25px 0;
}

.icon{
  width:64px;
  height:64px;
  margin:auto;
  border-radius:18px;
  display:grid;
  place-items:center;
  background:#141b2b;
  border:1px solid #29344b;
  font-size:28px;
}

h1{
  margin-top:15px;
  font-size:28px;
}

.sub{
  color:#8791a5;
  margin-top:7px;
}

.panel{
  background:#101621;
  border:1px solid #252f43;
  border-radius:18px;
  padding:18px;
}

.search{
  display:flex;
  gap:10px;
}

input{
  flex:1;
  min-width:0;
  padding:15px;
  border-radius:12px;
  border:1px solid #2a354b;
  background:#080d15;
  color:#fff;
  outline:none;
  font-size:16px;
}

input:focus{
  border-color:#6577ff;
}

button{
  padding:0 22px;
  border:0;
  border-radius:12px;
  background:#596cff;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

.status{
  margin-top:15px;
  padding:13px;
  border-radius:12px;
  background:#0c121d;
  color:#aeb8ca;
  display:none;
}

.title{
  margin:22px 0 10px;
  color:#aab4c7;
  font-size:14px;
}

pre{
  white-space:pre-wrap;
  word-break:break-word;
  overflow:auto;
  min-height:220px;
  max-height:500px;
  padding:18px;
  border-radius:14px;
  background:#080c13;
  border:1px solid #252f43;
  color:#b9c6df;
  font-size:14px;
  line-height:1.6;
}

.footer{
  text-align:center;
  color:#5e687b;
  margin-top:20px;
  font-size:13px;
}

@media(max-width:600px){
  body{
    padding:12px;
  }

  .search{
    flex-direction:column;
  }

  button{
    height:50px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="icon">⚡</div>
    <h1>API Tester</h1>
    <div class="sub">
      Third-party JSON API testing dashboard
    </div>
  </div>

  <div class="panel">

    <div class="search">
      <input
        id="search"
        type="text"
        value="03007958868"
        placeholder="Enter test value"
      >

      <button onclick="runAPI()">
        TEST API
      </button>
    </div>

    <div id="status" class="status"></div>

    <div class="title">
      API RESPONSE
    </div>

    <pre id="output">Waiting for request...</pre>

  </div>

  <div class="footer">
    API Tester • Demo
  </div>

</div>

<script>

const API_BASE =
  "http://wasifali.biz.id/public_apis/sim-info-api.php?search=";


async function runAPI(){

  const input =
    document.getElementById("search").value.trim();

  const output =
    document.getElementById("output");

  const status =
    document.getElementById("status");


  if(!input){

    status.style.display = "block";
    status.textContent = "Please enter a test value.";

    return;
  }


  status.style.display = "block";
  status.textContent = "Connecting to API...";

  output.textContent = "Loading...";


  const url =
    API_BASE + encodeURIComponent(input);


  try{

    const response =
      await fetch(url, {
        method: "GET",
        headers: {
          "Accept": "application/json"
        }
      });


    const text =
      await response.text();


    let data;

    try{
      data = JSON.parse(text);
    }
    catch{
      data = text;
    }


    if(!response.ok){

      status.textContent =
        "HTTP Error: " + response.status;

      output.textContent =
        typeof data === "string"
          ? data
          : JSON.stringify(data, null, 2);

      return;
    }


    status.textContent =
      "API response received successfully.";

    output.textContent =
      typeof data === "string"
        ? data
        : JSON.stringify(data, null, 2);


  }
  catch(error){

    status.textContent =
      "Request failed";

    output.textContent =
      "Failed to fetch API.\n\n" +
      "Possible reasons:\n" +
      "• API server is offline\n" +
      "• CORS is blocked\n" +
      "• HTTP/HTTPS mixed-content restriction\n" +
      "• Invalid API URL\n\n" +
      "Error: " + error.message;
  }

}


document
  .getElementById("search")
  .addEventListener("keydown", function(e){

    if(e.key === "Enter"){
      runAPI();
    }

  });

</script>

</body>
</html>
