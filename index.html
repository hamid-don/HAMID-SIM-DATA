<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAMID SIM DATABASE</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0b1120;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.card{
    width:100%;
    max-width:800px;
    background:#111827;
    border-radius:20px;
    padding:30px;
    box-shadow:0 0 30px rgba(0,0,0,.5);
}

.badge{
    display:inline-block;
    padding:8px 15px;
    background:#2563eb;
    border-radius:50px;
    font-weight:bold;
}

h1{
    margin:20px 0;
    text-align:center;
}

.sub{
    text-align:center;
    color:#9ca3af;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:16px;
    border:none;
    border-radius:12px;
    background:#1f2937;
    color:#fff;
    font-size:16px;
}

button{
    width:100%;
    padding:16px;
    margin-top:15px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:#fff;
    font-size:17px;
    cursor:pointer;
    font-weight:bold;
}

#result{
    margin-top:20px;
}

.record{
    background:#1f2937;
    padding:15px;
    border-radius:12px;
    margin-top:10px;
}

.footer{
    text-align:center;
    margin-top:25px;
    color:#60a5fa;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="card">

<span class="badge">HAMID SIM DATABASE</span>

<h1>HAMID SIM DATABASE</h1>

<p class="sub">Search SIM information.</p>

<input id="queryInput" type="text" placeholder="Enter Mobile Number">

<button onclick="fetchData()">SEARCH</button>

<div id="result"></div>

<div class="footer">
POWERED BY HAMID
</div>

</div>

<script>

function fetchData(){

const q=document.getElementById("queryInput").value.trim();
const result=document.getElementById("result");

if(!q){
alert("Enter Mobile Number");
return;
}

result.innerHTML='<div class="record">Searching...</div>';

fetch("http://wasifali.biz.id/public_apis/sim-info-api.php?search="+encodeURIComponent(q))
.then(r=>r.json())
.then(data=>{

if(data.success && data.records.length){

let html="";

data.records.forEach((r,i)=>{

html+=`
<div class="record">
<b>Record #${i+1}</b><br><br>

<b>Name:</b> ${r.name||"N/A"}<br>
<b>Mobile:</b> ${r.mobile||"N/A"}<br>
<b>CNIC:</b> ${r.cnic||"N/A"}<br>
<b>Address:</b> ${r.address||"N/A"}<br>
<b>Network:</b> ${r.network||"N/A"}

</div>
`;

});

result.innerHTML=html;

}else{

result.innerHTML='<div class="record">No Record Found.</div>';

}

}).catch(()=>{

result.innerHTML='<div class="record">API Error.</div>';

});

}

</script>

</body>
</html>
