<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAMID SIM DATABASE</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
background:#050816;
overflow:hidden;
}

body::before{
content:'';
position:fixed;
width:500px;
height:500px;
background:#2563eb;
filter:blur(200px);
top:-150px;
left:-150px;
opacity:.5;
}

body::after{
content:'';
position:fixed;
width:500px;
height:500px;
background:#7c3aed;
filter:blur(200px);
bottom:-150px;
right:-150px;
opacity:.5;
}

.card{
width:100%;
max-width:900px;
padding:35px;
border-radius:30px;
background:rgba(255,255,255,.05);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.08);
box-shadow:0 0 60px rgba(0,0,0,.5);
position:relative;
overflow:hidden;
}

.card::before{
content:'';
position:absolute;
top:0;
left:-100%;
width:100%;
height:100%;
background:linear-gradient(
90deg,
transparent,
rgba(255,255,255,.1),
transparent
);
animation:shine 6s linear infinite;
}

@keyframes shine{
100%{
left:100%;
}
}

.logo{
display:inline-block;
padding:10px 18px;
border-radius:50px;
background:linear-gradient(90deg,#2563eb,#7c3aed);
font-size:13px;
font-weight:700;
letter-spacing:2px;
color:#fff;
}

h1{
font-size:48px;
font-weight:800;
margin-top:20px;
background:linear-gradient(90deg,#60a5fa,#c084fc);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.subtitle{
color:#94a3b8;
margin-top:10px;
margin-bottom:25px;
font-size:15px;
}

.search-box{
background:rgba(255,255,255,.04);
padding:20px;
border-radius:25px;
border:1px solid rgba(255,255,255,.05);
}

input{
width:100%;
padding:18px;
border-radius:18px;
border:none;
outline:none;
background:#0f172a;
color:#fff;
font-size:16px;
}

input::placeholder{
color:#64748b;
}

button{
width:100%;
margin-top:15px;
padding:18px;
border:none;
border-radius:18px;
background:linear-gradient(90deg,#2563eb,#7c3aed);
color:white;
font-size:17px;
font-weight:700;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:translateY(-3px);
box-shadow:0 0 30px rgba(124,58,237,.5);
}

#result{
margin-top:25px;
}

.record{
padding:18px;
margin-top:15px;
border-radius:20px;
background:rgba(255,255,255,.05);
border-left:5px solid #60a5fa;
color:white;
animation:fade .4s ease;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.label{
color:#60a5fa;
font-weight:700;
}

.footer{
text-align:center;
margin-top:30px;
padding-top:20px;
border-top:1px solid rgba(255,255,255,.08);
color:#60a5fa;
font-weight:700;
letter-spacing:2px;
}

@media(max-width:700px){
h1{
font-size:34px;
}

.card{
padding:25px;
}
}
</style>
</head>

<body>

<div class="card">

<div class="logo">
HAMID SIM DATABASE
</div>

<h1>HAMID SIM DATABASE</h1>

<p class="subtitle">
Premium Database Search System
</p>

<div class="search-box">

<input
type="text"
id="queryInput"
placeholder="Enter Mobile Number">

<button onclick="fetchData()">
🔍 SEARCH DATABASE
</button>

<div id="result"></div>

</div>

<div class="footer">
⚡ POWERED BY HAMID ⚡
</div>

</div>

<script>

function fetchData(){

const q=document.getElementById("queryInput").value.trim();
const result=document.getElementById("result");

if(!q){
alert("Enter Mobile Number");
return;
}

result.innerHTML='<div class="record">Searching...</div>';

fetch("https://sim-info-api.wasif-ali.workers.dev/?search="+encodeURIComponent(q))
.then(r=>r.json())
.then(data=>{

if(data.success && data.records.length){

let html="";

data.records.forEach((r,i)=>{

html+=`
<div class="record">
<b>Record #${i+1}</b><br><br>

<b>Name:</b> ${r.name||"N/A"}<br>
<b>Mobile:</b> ${r.mobile||"N/A"}<br>
<b>CNIC:</b> ${r.cnic||"N/A"}<br>
<b>Address:</b> ${r.address||"N/A"}<br>
<b>Network:</b> ${r.network||"N/A"}

</div>
`;

});

result.innerHTML=html;

}else{

result.innerHTML='<div class="record">No Record Found.</div>';

}

}).catch(()=>{

result.innerHTML='<div class="record">API Error.</div>';

});

}

</script>

</body>
</html>
