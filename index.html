<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAMID SIM DATABASE</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:#050816;padding:20px;overflow:hidden;}
body::before{content:"";position:fixed;width:450px;height:450px;background:#2563eb;border-radius:50%;filter:blur(180px);left:-120px;top:-120px;opacity:.5;}
body::after{content:"";position:fixed;width:450px;height:450px;background:#7c3aed;border-radius:50%;filter:blur(180px);right:-120px;bottom:-120px;opacity:.5;}
.card{width:100%;max-width:900px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(18px);border-radius:30px;padding:35px;box-shadow:0 0 60px rgba(0,0,0,.5);}
.logo{display:inline-block;padding:10px 18px;background:linear-gradient(90deg,#2563eb,#7c3aed);border-radius:50px;font-weight:700;font-size:13px;letter-spacing:2px;}
h1{font-size:46px;margin:20px 0 8px;background:linear-gradient(90deg,#60a5fa,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.sub{color:#9ca3af;margin-bottom:25px;}
.search{display:flex;gap:15px;flex-wrap:wrap;}
input{flex:1;min-width:220px;padding:18px;border:none;outline:none;border-radius:18px;background:#0f172a;color:white;font-size:16px;}
button{padding:18px 30px;border:none;border-radius:18px;background:linear-gradient(90deg,#2563eb,#7c3aed);color:white;font-weight:bold;cursor:pointer;transition:.3s;}
button:hover{transform:translateY(-3px);box-shadow:0 0 25px rgba(124,58,237,.6);}
#result{margin-top:25px;}
.record{background:rgba(255,255,255,.05);padding:20px;border-radius:18px;border-left:5px solid #60a5fa;animation:fade .3s ease;}
.label{color:#60a5fa;font-weight:bold;}
.footer{margin-top:30px;text-align:center;color:#60a5fa;font-weight:700;letter-spacing:2px;}
@keyframes fade{from{opacity:0;transform:translateY(15px);}to{opacity:1;transform:translateY(0);}}
@media(max-width:650px){.search{flex-direction:column;}button{width:100%;}h1{font-size:34px;}}
</style>
</head>

<body>

<div class="card">
<div class="logo">HAMID SIM DATABASE</div>
<h1>HAMID SIM DATABASE</h1>
<p class="sub">Premium Search Interface</p>

<div class="search">
<input id="queryInput" type="text" placeholder="Enter Mobile Number">
<button onclick="fetchData()">🔍 SEARCH</button>
</div>

<div id="result"></div>

<div class="footer">⚡ POWERED BY HAMID ⚡</div>
</div>

<script>

function fetchData(){
const q=document.getElementById("queryInput").value.trim();
const result=document.getElementById("result");

if(!q){
alert("Enter Mobile Number");
return;
}

result.innerHTML='<div class="record">⏳ Searching...</div>';

fetch("https://sim-info-api.wasif-ali.workers.dev/?search="+encodeURIComponent(q))
.then(r=>r.json())
.then(data=>{

if(Array.isArray(data) && data.length > 0){

let html="";
data.forEach((r,i)=>{
html+=`
<div class="record">
<b>Record #${i+1}</b><br><br>
<span class="label">Name:</span> ${r.name||"N/A"}<br>
<span class="label">Mobile:</span> ${r.number||"N/A"}<br>
<span class="label">CNIC:</span> ${r.cnic||"N/A"}<br>
<span class="label">Address:</span> ${r.address||"N/A"}<br>
<span class="label">Network:</span> ${r.operator||"N/A"}
</div>
`;
});
result.innerHTML=html;

}else{
result.innerHTML='<div class="record" style="border-left-color:#ef4444;">❌ No Record Found.</div>';
}

}).catch((err)=>{
result.innerHTML=`<div class="record" style="border-left-color:#ef4444;">❌ API Error: ${err.message}</div>`;
});

}

</script>

</body>
</html>
